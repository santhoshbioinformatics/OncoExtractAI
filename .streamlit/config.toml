[theme]
base = "light"
primaryColor = "#087E8B"
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D2939"
linkColor = "#087E8B"
borderColor = "#DDE5EC"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["2rem", "1.45rem", "1.15rem", "1rem", ".9rem", ".8rem"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
greenColor = "#257A4F"
greenBackgroundColor = "#E7F4EC"
orangeColor = "#A15C07"
orangeBackgroundColor = "#FFF3DE"
redColor = "#B42318"
redBackgroundColor = "#FDECEA"
blueColor = "#2563A6"
blueBackgroundColor = "#EAF2FB"
grayColor = "#667085"
dataframeBorderColor = "#DDE5EC"
dataframeHeaderBackgroundColor = "#EEF3F7"
chartCategoricalColors = ["#087E8B", "#2563A6", "#6B5FA7", "#257A4F", "#D08A22", "#B94A48"]

[theme.sidebar]
backgroundColor = "#102A43"
secondaryBackgroundColor = "#183B56"
textColor = "#F6FAFD"
primaryColor = "#52C3C9"
borderColor = "#294A63"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 25
